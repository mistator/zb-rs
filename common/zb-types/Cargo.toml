[package]
name = "zb-types"
version = "0.1.0"
description = "Common types for use in Zigbee library"
repository.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true

[lib]
name = "zb_types"

[features]
default = ["alloc"]
alloc = [
    "hashbrown",
]

[dependencies]
byte = { workspace = true }
byte-derive = { workspace = true }
cfg-if = "1.0.4"
derive_more = { version = "2.1.1", default-features = false, features = ["full"] }
hashbrown = { version = "0.17.1", optional = true}
heapless = { workspace = true }
ieee802154 = { workspace = true }
zb-macros = { workspace = true  }
