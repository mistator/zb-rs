[package]
name = "zb-rs"
version = "0.1.0"
description = "Zigbee stack implementation for no-std environments"
repository.workspace = true
edition.workspace = true
license.workspace = true
categories.workspace = true

[lib]
name = "zigbee"

[features]
default = ["alloc"]
alloc = [
    "zb-types/alloc"
]

[dependencies]
aead = { version = "0.5.0", default-features = false }
aes = { version = "0.8.4", default-features = false }
bon = { workspace = true }
bounded-integer = "0.6.2"
byte = { workspace = true }
byte-derive = { workspace = true }
ccm = { version = "0.5.0", default-features = false }
ctr = { version = "0.9.2", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = ["full"]}
embassy-executor = { workspace = true }
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
heapless = { workspace = true }
ieee802154 = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
rand = { version = "0.10.1", default-features = false, features = ["alloc"] }
smart-default = { version = "0.7.1", default-features = false }
thiserror = { workspace = true }
zb-hal = { workspace = true }
zb-types = { workspace = true }
zb-macros = { workspace = true }
trait-variant = "0.1.3"

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embassy-executor = { workspace = true, features = ["platform-std"] }
embassy-sync = { workspace = true, features = ["std"] }
embassy-time = { workspace = true, features = ["generic-queue-32", "std"] }
futures-test = "0.3.33"
zb-hal-test-mock = { path = "../zb-hal-test-mock", version = "0.1.0", default-features = false }
