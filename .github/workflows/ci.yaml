name: Cargo build and test

on:
  workflow_dispatch:
  pull_request:
  push:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pull-requests: write 

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    env:
      RUSTUP_PERMIT_COPY_RENAME: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - name: Rustup update
        run: rustup update ${{ matrix.toolchain }}

      - name: Cargo build common
        working-directory: ./common
        run: cargo +${{ matrix.toolchain }} build

      - name: Cargo test common
        working-directory: ./common
        run: cargo +${{ matrix.toolchain }} test

      - name: Cargo build esp32
        working-directory: ./esp32
        run: cargo +${{ matrix.toolchain }} build

      - name: Cargo test esp32
        working-directory: ./esp32
        run: cargo +${{ matrix.toolchain }} test

      - name: Build examples
        working-directory: ./esp32/examples/esp-device
        env:
          CARGO_INCREMENTAL: 0
        run: cargo +${{ matrix.toolchain }} build -F esp32c6
